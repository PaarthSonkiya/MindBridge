[project]
name = "mindbridge-backend"
version = "0.1.0"
description = "MindBridge Understanding Engine — translating understanding, not just language."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Paarth Sonkiya" }]
dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.29,<1.0",
    "pydantic>=2.6,<3.0",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.4"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "B008",   # FastAPI dependency-injection pattern
    "UP042",  # `str, Enum` is intentional for explicit JSON serialisation
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # readable inline assertions
