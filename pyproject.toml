[project]
name = "mindbridge"
version = "0.3.0"
description = "Offline on-device voice translation and operational memory for multilingual factory floors (Qualcomm QCS6490)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sonkiya Paarth" }]

[project.scripts]
mindbridge = "mindbridge.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mindbridge*"]

[tool.setuptools.package-data]
mindbridge = ["ui/*", "ui/fonts/*"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["models", "data", "bench/results"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
