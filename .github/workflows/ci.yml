name: CI

on:
  push:
    branches: [main, phase3-prototype]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint & test (no models needed)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install -r requirements.txt pytest httpx ruff
      - name: Ruff
        run: ruff check mindbridge tests bench qualcomm scripts
      - name: Pytest
        run: pytest -q
