# MindBridge runtime configuration.
# Every key can be overridden with MINDBRIDGE_<SECTION>_<KEY>, e.g. MINDBRIDGE_ASR_BACKEND=cpu

models_dir = "models"          # relative to the repo root, or absolute
data_dir = "data"              # operational memory database + logs
default_pair = "vi-en"         # vi-en | vi-ko | vi-zh
host = "127.0.0.1"             # UI is served on the device itself (loopback only)
port = 8765
strict_offline = true          # refuse every non-loopback network connection at runtime

[asr]
backend = "auto"               # auto = NPU (QNN) if available, else CPU
qnn_model_dir = "asr/whisper-small-quantized-qcs6490"
cpu_model_dir = "asr/sherpa-onnx-whisper-small"
cpu_model_prefix = "small"
max_tokens = 120
threads = 4

[mt]
model_dir = "mt/nllb-200-distilled-600M-ct2-int8"
beam_size = 2
threads = 4
max_decoding_length = 200

[tts]
enabled = true
threads = 2
speed = 1.0

[audio]
input_device = ""              # "" = system default; or a name fragment like "USB"
output_device = ""
sample_rate = 16000
vad_endpoint_silence_s = 0.9
max_utterance_s = 25.0
