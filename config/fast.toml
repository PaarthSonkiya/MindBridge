# MindBridge "fast mode": lower latency, lower accuracy.
#   MINDBRIDGE_CONFIG=config/fast.toml bash scripts/run.sh
# Whisper-small on the NPU (~0.7 s per sentence vs ~1.8 s for turbo on RB3 Gen 2); translators unchanged.
# Measured cost: Vietnamese WER 22.9% vs 10.9% (FLEURS). For even faster KO/ZH translation, fetch
# NLLB-600M (scripts/fetch_models.py --nllb 600M) and point model_dir at it (2-4 BLEU lower on FLORES).

models_dir = "models"
data_dir = "data"
default_pair = "vi-en"
host = "127.0.0.1"
port = 8765
strict_offline = true

[asr]
backend = "auto"
qnn_model_dir = "asr/whisper-small-quantized-qcs6490"
cpu_model_dir = "asr/ct2-whisper-small"
max_tokens = 120
threads = 4

[mt]
en_vi_model_dir = "mt/envit5-translation-ct2-int8"
en_vi_beam_size = 1
model_dir = "mt/nllb-200-distilled-1.3B-ct2-int8"
beam_size = 2
threads = 4
max_decoding_length = 200

[tts]
enabled = true
threads = 2
speed = 1.0

[audio]
input_device = ""
output_device = ""
sample_rate = 16000
vad_endpoint_silence_s = 0.9
max_utterance_s = 25.0
